<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for AppIcon.icns. Regenerate with scripts/make-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#161A21"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB8FF"/>
      <stop offset="1" stop-color="#3D82E6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Body on the macOS icon grid: 824 pt square, 100 pt margin. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- A display with a split tree: focused tile on the left, a column of two on the right. -->
  <rect x="226" y="262" width="572" height="440" rx="36" fill="none" stroke="#E5E9F0" stroke-width="22"/>
  <rect x="262" y="298" width="246" height="368" rx="14" fill="url(#focus)"/>
  <rect x="530" y="298" width="232" height="173" rx="14" fill="#E5E9F0" fill-opacity="0.45"/>
  <rect x="530" y="493" width="232" height="173" rx="14" fill="#E5E9F0" fill-opacity="0.45"/>
  <!-- Focused-display bar. -->
  <rect x="402" y="748" width="220" height="22" rx="11" fill="#E5E9F0"/>
</svg>
