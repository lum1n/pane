[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
pane-core = { path = "crates/pane-core" }
pane-macos = { path = "crates/pane-macos" }
pane-agent = { path = "crates/pane-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
slotmap = { version = "1", features = ["serde"] }
regex = "1"
thiserror = "2"
smol_str = { version = "0.3", features = ["serde"] }
crossbeam-channel = "0.5"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
